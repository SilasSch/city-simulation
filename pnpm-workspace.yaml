packages:
  - 'apps/*'
  - 'libs/*'

# Prisma 6 ships no native Windows ARM64 query engine. Keep the current
# platform packages and add x64 binaries for Windows' Node emulation.
supportedArchitectures:
  os: [current]
  cpu: [current, x64]

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true

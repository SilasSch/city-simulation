services:
  postgres:
    image: postgres:16-alpine
    container_name: city-simulation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: city
      POSTGRES_DB: city_simulation
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U city -d city_simulation']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

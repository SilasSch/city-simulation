name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema apps/server/prisma/schema.prisma

      # Pull requests intentionally use only this fast feedback loop.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # The heavier database and browser checks run once after merge, not on
      # every pull-request update.
      - name: Start PostgreSQL
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name city-ci-postgres \
            -e POSTGRES_USER=city \
            -e POSTGRES_PASSWORD=city \
            -e POSTGRES_DB=city_simulation \
            -p 5432:5432 \
            postgres:16-alpine
          for attempt in {1..20}; do
            if docker exec city-ci-postgres pg_isready -U city -d city_simulation; then
              exit 0
            fi
            sleep 1
          done
          docker logs city-ci-postgres
          exit 1

      - name: Read Playwright version
        if: github.event_name != 'pull_request'
        id: playwright-version
        run: echo "version=$(node -p \"require('@playwright/test/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        if: github.event_name != 'pull_request'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Prepare Playwright Chromium
        if: github.event_name != 'pull_request'
        run: |
          pnpm exec playwright install-deps chromium
          pnpm exec playwright install chromium

      - name: Run database migrations
        if: github.event_name != 'pull_request'
        run: pnpm exec prisma migrate deploy --schema apps/server/prisma/schema.prisma

      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm test

      - name: End-to-end smoke test
        if: github.event_name != 'pull_request'
        run: pnpm e2e

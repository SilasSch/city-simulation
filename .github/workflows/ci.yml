name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check required production variables
        run: |
          if output=$(env -u POSTGRES_PASSWORD \
            DOMAIN=city.example.com \
            CLIENT_ORIGIN=https://city.example.com \
            docker compose -f docker-compose.prod.yml config --quiet 2>&1); then
            echo 'Production Compose validation unexpectedly accepted missing required variables.' >&2
            exit 1
          fi

          if ! grep -Fq 'set POSTGRES_PASSWORD' <<<"$output"; then
            echo 'Production Compose validation failed without the expected POSTGRES_PASSWORD guidance.' >&2
            echo "$output" >&2
            exit 1
          fi

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Detect Docker and Compose changes
        if: github.event_name == 'pull_request'
        id: container-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .dockerignore \
            docker-compose.prod.yml \
            'apps/*/Dockerfile' \
            deploy/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # Pull requests build the staging images only when their container
      # definition changed. Main and manual runs always build all images.
      - name: Build production images
        if: github.event_name != 'pull_request' || steps.container-changes.outputs.changed == 'true'
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml build migrate server client

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema apps/server/prisma/schema.prisma

      # Pull requests intentionally use only this fast feedback loop.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # The database migration and one focused browser smoke test run once
      # after merge or on an explicitly dispatched workflow, not on every PR.
      - name: Start PostgreSQL
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name city-ci-postgres \
            -e POSTGRES_USER=city \
            -e POSTGRES_PASSWORD=city \
            -e POSTGRES_DB=city_simulation \
            -p 5432:5432 \
            postgres:16-alpine
          for attempt in {1..20}; do
            if docker exec city-ci-postgres pg_isready -U city -d city_simulation; then
              exit 0
            fi
            sleep 1
          done
          docker logs city-ci-postgres
          exit 1

      - name: Read Playwright version
        if: github.event_name != 'pull_request'
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        if: github.event_name != 'pull_request'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      # GitHub-hosted runners already contain the required shared libraries.
      # Only download Chromium on a cold cache miss; do not apt-install system
      # packages on every run.
      - name: Install Playwright Chromium on cache miss
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Run database migrations
        if: github.event_name != 'pull_request'
        run: pnpm exec prisma migrate deploy --schema apps/server/prisma/schema.prisma

      - name: Focused end-to-end smoke test
        if: github.event_name != 'pull_request'
        run: pnpm e2e
